services:
  db:
    image: postgres:18.1-alpine3.23
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - 5432:5432
    volumes:
      # A partir do Postgres 18 a imagem guarda os dados em /var/lib/postgresql/18/docker
      # e recusa iniciar se houver um volume montado em /var/lib/postgresql/data.
      - postgres:/var/lib/postgresql

volumes:
  postgres:
